<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proportional Symbols Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
<style>
  body { margin: 0; }
  #map { height: 100vh; }
  .d3-overlay { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  circle { pointer-events: all; cursor: pointer; }

  .legendSize text, .legendSize .legendTitle { fill: black;}

  #tooltip {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 12px;
    font: 14px sans-serif;
    pointer-events: none;
    display: none;
    z-index: 1000;
  }
  #tooltip strong { display: block; margin-bottom: 2px; }
  #tooltip span { color: #555; font-size: 12px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="tooltip"><strong></strong><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>

const map = L.map('map').setView([38, -97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const svg = d3.select(map.getPanes().overlayPane).append('svg').attr('class', 'd3-overlay');
const g   = svg.append('g').attr('class', 'leaflet-zoom-hide');

const tooltip = document.getElementById('tooltip');

d3.csv("expensive-states.csv").then(function(data) {

  data.forEach(function(d) {
    d.lat        = +d.latitude;
    d.lng        = +d.longitude;
    d.housingCost = +d.housingCost;
    d.costRank    = +d.costRank;
  });

  const r = d3.scaleSqrt().domain([0, d3.max(data, d => d.housingCost)]).range([0, 25]);

const circles = g.selectAll('circle')
  .data(data).join('circle')
  .attr('r', d => r(d.housingCost))
  .attr('fill',   d => d.costRank <= 10 ? 'orange' : 'steelblue') // 10 highest
  .attr('fill-opacity', 0.4)
  .attr('stroke', d => d.costRank <= 10 ? 'orange' : 'steelblue') // 10 highest
  .on('mouseover', function(event, d) {
    d3.select(this).attr('fill-opacity', 0.7);
    tooltip.style.display = 'block';
    tooltip.querySelector('strong').textContent = d.State;
    tooltip.querySelector('span').textContent = 'Housing Cost Index: ' + d.housingCost;
  })
  .on('mousemove', function(event) {
    tooltip.style.left = (event.pageX + 12) + 'px';
    tooltip.style.top  = (event.pageY - 28) + 'px';
  })
  .on('mouseout', function() {
    d3.select(this).attr('fill-opacity', 0.4);
    tooltip.style.display = 'none';
  });

function update() {
  const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
  const br = map.latLngToLayerPoint(map.getBounds().getSouthEast());
  svg.style('left', tl.x + 'px').style('top', tl.y + 'px')
     .attr('width', br.x - tl.x).attr('height', br.y - tl.y);
  g.attr('transform', `translate(${-tl.x},${-tl.y})`);
  circles
    .attr('cx', d => map.latLngToLayerPoint([d.lat, d.lng]).x)
    .attr('cy', d => map.latLngToLayerPoint([d.lat, d.lng]).y);
}

update();
map.on('moveend', update);

// Legend: https://d3-legend.susielu.com/
var legendSvg = d3.select("body")
      .append("svg")     
      .style("position", "absolute")
      .style("bottom", "20px")
      .style("left", "20px")
      .style("background", "rgba(255, 255, 255, 0.7)")
      .style("padding", "8px")
      .style("z-index", "1000") // source: https://stackoverflow.com/questions/13595175/updating-svg-element-z-index-with-d3
      .attr("width", 180)
      .attr("height", 260)

legendSvg.append("g")
      .attr("class", "legendSize")
      .attr("transform", "translate(20,30)");

var legendSize = d3.legendSize()
  .scale(r)
  .shape('circle')
  .shapePadding(15)
  .labelOffset(20)
  .title('Housing Cost Index')
  .cells([80, 160, 240])

legendSvg.select(".legendSize")
  .call(legendSize);

// Other part of the legend
legendSvg.append('circle')
  .attr('cx', 20)
  .attr('cy', 200)
  .attr('r', 7)
  .attr('fill', 'orange')
  .attr('fill-opacity', 0.6);

legendSvg.append('text')
  .attr('x', 35)
  .attr('y', 204)
  .style('font-size', '11px')
  .text('Top 10 Expensive');

legendSvg.append('circle')
  .attr('cx', 20)
  .attr('cy', 225)
  .attr('r', 7)
  .attr('fill', 'steelblue')
  .attr('fill-opacity', 0.6);

legendSvg.append('text')
  .attr('x', 35)
  .attr('y', 229)
  .style('font-size', '11px')
  .text('Other States');

});
</script>
</body>
</html>
