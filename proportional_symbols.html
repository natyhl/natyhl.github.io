
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Chart in D3</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #ccc;
        }

        .axis text {
            font-size: 12px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        // Aiming for grade A, and two extra credits
        // Starter code: https://observablehq.com/@d3/bubble-chart/2
        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 600;
        const margin = { top: 60, right: 200, bottom: 80, left: 100 };
        
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight);

        const chart = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("Smartphone.csv").then(function(data) {

            // Convert string values to numbers
            data.forEach(function(d) {
                d.Daily_Phone_Hours = +d.Daily_Phone_Hours;
                d.Sleep_Hours = +d.Sleep_Hours;
                d.Work_Productivity_Score = +d.Work_Productivity_Score;
                d.Stress_Level = +d.Stress_Level;
            });

            // Define X and Y scales
            const scaleX = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.Daily_Phone_Hours)])
                .nice()
                .range([0, width]);

            const scaleY = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.Sleep_Hours)])
                .nice()
                .range([height, 0]);

            // Size scale, source: https://d3-legend.susielu.com/
            const scaleSize = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.Work_Productivity_Score)])
                .range([3, 20]);

            // Color scale, source: https://d3-legend.susielu.com/
            const scaleColor = d3.scaleSequential(d3.interpolateRdYlGn)
                .domain([d3.max(data, d => d.Stress_Level), 0]);

            // Add X and Y axes
            chart.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(scaleX))
                .selectAll("text") 

            chart.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(scaleY).ticks(5));

            // Add bubbles
            chart.selectAll("circle")
                .data(data)
                .enter()
                .append("circle")
                .attr("cx", d => scaleX(d.Daily_Phone_Hours))
                .attr("cy", d => scaleY(d.Sleep_Hours))
                .attr("r", d => scaleSize(d.Work_Productivity_Score))
                .attr("fill", d => scaleColor(d.Stress_Level))
                .attr("opacity", 0.6)
                .attr("stroke", "#333")
                .attr("stroke-width", 0.5);

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", svgWidth / 2)
                .attr("y", 30) 
                .attr("text-anchor", "middle") 
                .text("Phone Usage vs Sleep - Bubble Chart");

            // X-axis label
            //Source: https://stackoverflow.com/questions/11189284/d3-axis-labeling
            svg.append("text")
                .attr("class", "x label")
                .attr("text-anchor", "middle")
                .attr("x", svgWidth / 2)
                .attr("y", svgHeight - 20)
                .text("Daily Phone Hours");

            // Y-axis label
            svg.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "middle")
                .attr("x", -svgHeight / 2)
                .attr("y", 8)
                .attr("dy", ".75em")
                .attr("transform", "rotate(-90)")
                .text("Sleep Hours");

            // Legend: https://d3-legend.susielu.com/
            svg.append("g")
              .attr("class", "legendSize")
              .attr("transform", `translate(${width + margin.left + 20}, 80)`);

            var legendSize = d3.legendSize()
              .scale(scaleSize)
              .shape('circle')
              .shapePadding(15)
              .labelOffset(20)
              .title('Productivity Score');

            svg.select(".legendSize")
              .call(legendSize);

            svg.append("g")
              .attr("class", "legendColor")
              .attr("transform", `translate(${width + margin.left + 20}, 320)`);

            var legend = d3.legendColor()
              .scale(scaleColor)
              .title("Stress Level");

            svg.select(".legendColor")
              .call(legend);

        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leaflet + D3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  body { margin: 0; }
  #map { height: 100vh; }
  .d3-overlay { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  circle { pointer-events: all; cursor: pointer; }

  #tooltip {
    position: absolute;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 8px 12px;
    font: 14px sans-serif;
    pointer-events: none;
    display: none;
    z-index: 1000;
  }
  #tooltip strong { display: block; margin-bottom: 2px; }
  #tooltip span { color: #555; font-size: 12px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="tooltip"><strong></strong><span></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const CITIES = [
  { name: "New York",      lat: 40.71, lng: -74.01, pop: 8336817 },
  { name: "Los Angeles",   lat: 34.05, lng:-118.24, pop: 3979576 },
  { name: "Chicago",       lat: 41.85, lng: -87.65, pop: 2693976 },
  { name: "Houston",       lat: 29.76, lng: -95.37, pop: 2304580 },
  { name: "Phoenix",       lat: 33.45, lng:-112.07, pop: 1608139 },
  { name: "Philadelphia",  lat: 39.95, lng: -75.17, pop: 1603797 },
  { name: "San Antonio",   lat: 29.42, lng: -98.49, pop: 1434625 },
  { name: "San Diego",     lat: 32.72, lng:-117.16, pop: 1386932 },
  { name: "Dallas",        lat: 32.78, lng: -96.80, pop: 1304379 },
  { name: "San Jose",      lat: 37.34, lng:-121.89, pop: 1013240 },
];

const map = L.map('map').setView([38, -97], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const svg = d3.select(map.getPanes().overlayPane).append('svg').attr('class', 'd3-overlay');
const g   = svg.append('g').attr('class', 'leaflet-zoom-hide');

const r = d3.scaleSqrt().domain([0, 8336817]).range([0, 30]);

const tooltip = document.getElementById('tooltip');

const circles = g.selectAll('circle')
  .data(CITIES).join('circle')
  .attr('r', d => r(d.pop))
  .attr('fill', 'steelblue')
  .attr('fill-opacity', 0.4)
  .attr('stroke', 'steelblue')
  .on('mouseover', function(event, d) {
    d3.select(this).attr('fill-opacity', 0.7);
    tooltip.style.display = 'block';
    tooltip.querySelector('strong').textContent = d.name;
    tooltip.querySelector('span').textContent = d.pop.toLocaleString() + ' residents';
  })
  .on('mousemove', function(event) {
    tooltip.style.left = (event.pageX + 12) + 'px';
    tooltip.style.top  = (event.pageY - 28) + 'px';
  })
  .on('mouseout', function() {
    d3.select(this).attr('fill-opacity', 0.4);
    tooltip.style.display = 'none';
  });

function update() {
  const tl = map.latLngToLayerPoint(map.getBounds().getNorthWest());
  const br = map.latLngToLayerPoint(map.getBounds().getSouthEast());
  svg.style('left', tl.x + 'px').style('top', tl.y + 'px')
     .attr('width', br.x - tl.x).attr('height', br.y - tl.y);
  g.attr('transform', `translate(${-tl.x},${-tl.y})`);
  circles
    .attr('cx', d => map.latLngToLayerPoint([d.lat, d.lng]).x)
    .attr('cy', d => map.latLngToLayerPoint([d.lat, d.lng]).y);
}

update();
map.on('moveend', update);
</script>
</body>
</html>
