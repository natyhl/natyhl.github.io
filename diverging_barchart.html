
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diverging Bar Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #ccc;
        }

        .axis text {
            font-size: 12px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        // Aiming for grade A+
        // Starter code: bar_chart_in_d3.html

        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 600;
        const margin = { top: 60, right: 300, bottom: 80, left: 100 };
        
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight);


        const chart = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("Smartphone_smaller.csv").then(function(data) {

            // Convert string values to numbers
            data.forEach(function(d) {
                d.Stress_Level = +d.Stress_Level;
            });

            // Define X and Y scales
            const scaleX = d3.scaleLinear()
                .domain([-d3.max(data, d => d.Stress_Level), d3.max(data, d => d.Stress_Level)]) // diverging bar chart scale
                .range([0, width]);

            const scaleY = d3.scaleBand() // source: https://observablehq.com/@d3/diverging-bar-chart/2
                .domain(data.map(d => d.User_ID))
                .range([0, height])
                .padding(0.1); // for better visibility

            const colorScale = d3.scaleOrdinal() // source: https://d3-legend.susielu.com/
                .domain(["Female", "Male"])
                .range([d3.schemeRdBu[3][0], d3.schemeRdBu[3][2]]); // source: https://observablehq.com/@d3/diverging-bar-chart/2 // Red for Female, Blue for Male

            // Add axes
            chart.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(scaleX));

            chart.append("g")
                .attr("class", "axis axis-y")
                .attr("transform", `translate(${scaleX(0)}, 0)`)

            // Add bars
            chart.selectAll(".bar")
                .data(data)
                .enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", d => {
                    if (d.Gender === "Female") {
                        return scaleX(-d.Stress_Level); // Female on left
                    } else {
                        return scaleX(0); // and male on right
                    }
                })
              .attr("y", d => scaleY(d.User_ID))
              .attr("width", d => Math.abs(scaleX(d.Stress_Level) - scaleX(0)))
              .attr("height", scaleY.bandwidth())
              .style("fill", d => d.Gender == "Female" ? d3.schemeRdBu[3][0] : d3.schemeRdBu[3][2]);

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", svgWidth / 2)
                .attr("y", 30) 
                .attr("text-anchor", "middle") 
                .text("Stress Level by Gender - Diverging Bar Chart");

            // X-axis label
            //Source: https://stackoverflow.com/questions/11189284/d3-axis-labeling
            svg.append("text")
                .attr("class", "x label")
                .attr("text-anchor", "middle")
                .attr("x", svgWidth / 2)
                .attr("y", svgHeight - 20)
                .text("Stress Level");

            // Y-axis label
            svg.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "middle")
                .attr("x", -svgHeight / 2)
                .attr("y", 8)
                .attr("dy", ".75em")
                .attr("transform", "rotate(-90)")
                .text("Gender");

            // Add legend, source: https://d3-legend.susielu.com/
                svg.append("g")
                   .attr("class", "legendOrdinal")
                   .attr("transform", `translate(${width + margin.left + 20}, 100)`);

                var legendOrdinal = d3.legendColor()
                    .shapeWidth(30)
                    .orient("vertical")
                    .scale(colorScale) 
                    .title("Gender");

                svg.select(".legendOrdinal")
                  .call(legendOrdinal);
            });
    </script>
</body>
</html>
