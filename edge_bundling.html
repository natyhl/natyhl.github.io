
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node-link Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .node circle {
            fill: #64c8c8;
        }
        .node circle:hover {
            fill: orange;
        }
        .axis text {
            font-size: 12px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Aiming for grade A
        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 900;
        const radius = svgWidth / 2;

        const colornone = "#ccc"; // source: https://observablehq.com/@d3/hierarchical-edge-bundling
        const colorin   = "#f00"; 
        const colorout  = "#00f";

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .attr("viewBox", [-radius, -radius, svgWidth, svgHeight] // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            .attr("style", "max-width: 100%; height: auto; font: 10px sans-serif;");

        const tooltip = d3.select("#tooltip");

        d3.csv("soc-dolphins.csv").then(function(data) {

            // Get node names
            const nodes = d3.groups(data.flatMap(d => [d.source.trim(), d.target.trim()]), d => d)
                .map(([id]) => id)
                .sort();

            const adjacency = {};
            nodes.forEach(n => {
                adjacency[n] = {};
                nodes.forEach(m => { adjacency[n][m] = 0; }); // initialize
            });

            data.forEach(d => {
                const a = d.source.trim();
                const b= d.target.trim();
                adjacency[a][b] = 1; // mark connection
                adjacency[b][a] = 1;
            });

            // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            const tree = d3.cluster()
                .size([2 * Math.PI, radius - 100]);
            const root = tree(bilink(d3.hierarchy(data)
                .sort((a, b) => d3.ascending(a.height, b.height) || d3.ascending(a.data.name, b.data.name))));

            const links = data.map(d => ({source: d.source, target: d.target})); // source: https://observablehq.com/@d3/force-directed-graph/2
            const nodes = d3.groups(data.flatMap(d => [d.source, d.target]), d => d)
                            .map(([id]) => ({id}));

            // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            const node = svg.append("g")
                .selectAll()
                .data(root.leaves())
                .join("g")
                  .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
                .append("text")
                  .attr("dy", "0.31em")
                  .attr("x", d => d.x < Math.PI ? 6 : -6)
                  .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
                  .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                  .text(d => d.data.name)
                  .each(function(d) { d.text = this; })
                  .on("mouseover", overed)
                  .on("mouseout", outed)
                  .call(text => text.append("title").text(d => `${id(d)}
            ${d.outgoing.length} outgoing
            ${d.incoming.length} incoming`));


            const line = d3.lineRadial()
                .curve(d3.curveBundle.beta(0.85))
                .radius(d => d.y)
                .angle(d => d.x);

              const link = svg.append("g")
                  .attr("stroke", colornone)
                  .attr("fill", "none")
                .selectAll()
                .data(root.leaves().flatMap(leaf => leaf.outgoing))
                .join("path")
                  .style("mix-blend-mode", "multiply")
                  .attr("d", ([i, o]) => line(i.path(o)))
                  .each(function(d) { d.path = this; });

              function overed(event, d) {
                link.style("mix-blend-mode", null);
                d3.select(this).attr("font-weight", "bold");
                d3.selectAll(d.incoming.map(d => d.path)).attr("stroke", colorin).raise();
                d3.selectAll(d.incoming.map(([d]) => d.text)).attr("fill", colorin).attr("font-weight", "bold");
                d3.selectAll(d.outgoing.map(d => d.path)).attr("stroke", colorout).raise();
                d3.selectAll(d.outgoing.map(([, d]) => d.text)).attr("fill", colorout).attr("font-weight", "bold");
              }

              function outed(event, d) {
                link.style("mix-blend-mode", "multiply");
                d3.select(this).attr("font-weight", null);
                d3.selectAll(d.incoming.map(d => d.path)).attr("stroke", null);
                d3.selectAll(d.incoming.map(([d]) => d.text)).attr("fill", null).attr("font-weight", null);
                d3.selectAll(d.outgoing.map(d => d.path)).attr("stroke", null);
                d3.selectAll(d.outgoing.map(([, d]) => d.text)).attr("fill", null).attr("font-weight", null);
              }

            const color = d3.scaleOrdinal(d3.schemeDark2);

            // Create a simulation with several forces, source: https://observablehq.com/@d3/force-directed-graph/2
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id))
                .force("charge", d3.forceManyBody())
                .force("center", d3.forceCenter(svgWidth / 2, svgHeight / 2))
                .on("tick", ticked);

            // Add a line for each link, and a circle for each node.
            const link = svg.append("g")
                .attr("stroke", "#999")
                .attr("stroke-opacity", 0.6)
                .selectAll()
                .data(links)
                .join("line")
                .attr("stroke-width", 1.5);

            const node = svg.append("g")
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .selectAll()
                .data(nodes)
                .join("circle")
                .attr("r", 5)
                .attr("fill", d => color(d.id));

            node.call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

            node
            // Tooltip
            .on("mouseover", (event, d) => {
                tooltip
                    .html(`<strong>${d.id}</strong>`)
                    .style("opacity", 1);
            })
            .on("mousemove", (event) => {
                tooltip
                    .style("left", (event.pageX + 12) + "px")
                    .style("top",  (event.pageY - 28) + "px");
            })
            .on("mouseleave", () => {
                tooltip.style("opacity", 0);
            });

          // Set the position attributes of links and nodes each time the simulation ticks, source: https://observablehq.com/@d3/force-directed-graph/2
          function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
          }

          // Reheat the simulation when drag starts, and fix the subject position.
          function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
          }

          // Update the subject (dragged node) position during drag.
          function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
          }

          // Restore the target alpha so the simulation cools after dragging ends.
          // Unfix the subject position now that it’s no longer being dragged.
          function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
          }

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", svgWidth / 2)
                .attr("y", 30) 
                .attr("text-anchor", "middle") 
                .text("Dolphins Social Network - Node-link Diagram");
        });
    </script>
</body>
</html>
