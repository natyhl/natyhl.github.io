
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge-Bundling</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Aiming for grade A
        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 1200;
        const radius = svgWidth / 2;

        const colornone = "#ccc"; // source: https://observablehq.com/@d3/hierarchical-edge-bundling
        const colorin   = "#f00"; 
        const colorout  = "#00f";

        const tooltip = d3.select("#tooltip");

        d3.csv("soc-dolphins.csv").then(function(data) {

            // Get node names
            const nodes = d3.groups(data.flatMap(d => [d.source.trim(), d.target.trim()]), d => d)
                .map(([id]) => id)
                .sort();

            const neighbours = {};
            nodes.forEach(n => {
                neighbours[n] = nodes.filter(m => // source: https://d3js.org/d3-selection/selecting
                data.some(d => (d.source.trim() == n && d.target.trim() == m) || (d.target.trim() == n && d.source.trim() == m)));
            });

            function hierarchy(data, delimiter = ".") { // source: https://observablehq.com/@d3/hierarchical-edge-bundling
              let root;
              const map = new Map;
              data.forEach(function find(data) {
                const {name} = data;
                if (map.has(name)) return map.get(name);
                const i = name.lastIndexOf(delimiter);
                map.set(name, data);
                if (i >= 0) {
                  find({name: name.substring(0, i), children: []}).children.push(data);
                  data.name = name.substring(i + 1);
                } else {
                  root = data;
                }
                return data;
              });
              return root;
            }

            // store connections
            const hData = nodes.map(n => ({ name: "root." + n }));

            const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .attr("viewBox", [-radius, -radius, svgWidth, svgHeight]) // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            .attr("style", "max-width: 100%; height: auto; font: 10px sans-serif;");

            // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            const tree = d3.cluster()
                .size([2 * Math.PI, radius - 100]);
            const root = tree(bilink(d3.hierarchy(hierarchy(hData))
                .sort((a, b) => d3.ascending(a.height, b.height) || d3.ascending(a.data.name, b.data.name))));

            // source: https://observablehq.com/@d3/hierarchical-edge-bundling
            const node = svg.append("g")
                .selectAll()
                .data(root.leaves())
                .join("g")
                  .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
                .append("text")
                  .attr("dy", "0.31em")
                  .attr("x", d => d.x < Math.PI ? 6 : -6)
                  .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
                  .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                  .text(d => d.data.name)
                  .each(function(d) { d.text = this; })
                  .on("mouseover", overed)
                  .on("mouseout", outed)
                  .call(text => text.append("title").text(d => `${d.data.name}
            ${d.outgoing.length} outgoing
            ${d.incoming.length} incoming`));

            const line = d3.lineRadial()
                .curve(d3.curveBundle.beta(0.85))
                .radius(d => d.y)
                .angle(d => d.x);

              const link = svg.append("g")
                  .attr("stroke", colornone)
                  .attr("fill", "none")
                .selectAll()
                .data(root.leaves().flatMap(leaf => leaf.outgoing))
                .join("path")
                  .style("mix-blend-mode", "multiply")
                  .attr("d", ([i, o]) => line(i.path(o)))
                  .each(function(d) { d.path = this; });

              function overed(event, d) {
                tooltip.html(`<strong>${d.data.name}</strong>: ${d.outgoing.length} connections`).style("opacity", 1).style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px");
                link.style("mix-blend-mode", null);
                d3.select(this).attr("font-weight", "bold");
                d3.selectAll(d.incoming.map(d => d.path)).attr("stroke", colorin).raise();
                d3.selectAll(d.incoming.map(([d]) => d.text)).attr("fill", colorin).attr("font-weight", "bold");
                d3.selectAll(d.outgoing.map(d => d.path)).attr("stroke", colorout).raise();
                d3.selectAll(d.outgoing.map(([, d]) => d.text)).attr("fill", colorout).attr("font-weight", "bold");
              }

              function outed(event, d) {
                tooltip.style("opacity", 0);
                link.style("mix-blend-mode", "multiply");
                d3.select(this).attr("font-weight", null);
                d3.selectAll(d.incoming.map(d => d.path)).attr("stroke", null);
                d3.selectAll(d.incoming.map(([d]) => d.text)).attr("fill", null).attr("font-weight", null);
                d3.selectAll(d.outgoing.map(d => d.path)).attr("stroke", null);
                d3.selectAll(d.outgoing.map(([, d]) => d.text)).attr("fill", null).attr("font-weight", null);
              }

        function bilink(root) { // source: https://observablehq.com/@d3/hierarchical-edge-bundling
          const map = new Map(root.leaves().map(d => [d.data.name, d]));
          for (const d of root.leaves()) d.incoming = [], d.outgoing = (neighbours[d.data.name] || []).map(m => [d, map.get(m)]).filter(([, o]) => o);
          for (const d of root.leaves()) for (const o of d.outgoing) o[1].incoming.push(o);
          return root;
        }

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", 0)
                .attr("y", -radius + 20) 
                .attr("text-anchor", "middle") 
                .text("Dolphins Social Network - Edge-Bundling");
        });
    </script>
</body>
</html>
