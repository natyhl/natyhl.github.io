
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacency Matrix</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #ccc;
        }

        .axis text {
            font-size: 10px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Aiming for grade A
        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 1200;
        const margin = { top: 150, right: 20, bottom: 80, left: 100 };
        
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight)
            .style("width", "100%") // source: https://observablehq.com/@fabiodesousa/adjacency-matrix
            .style("height", "auto")
            .style("font", "1rem verdana");


        const chart = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("soc-dolphins.csv").then(function(data) {

            // Get node names
            const nodes = d3.groups(data.flatMap(d => [d.source.trim(), d.target.trim()]), d => d)
                .map(([id]) => id)
                .sort();

            const adjacency = {};
            nodes.forEach(n => {
                adjacency[n] = {};
                nodes.forEach(m => { adjacency[n][m] = 0; }); // initialize
            });

            data.forEach(d => {
                const a = d.source.trim();
                const b= d.target.trim();
                adjacency[a][b] = 1; // mark connection
                adjacency[b][a] = 1;
            });

            const categories = nodes;
            // each doplhin becomes row in matrix
            const matrix = nodes.map(rowNode => { 
                adjacency[rowNode].index = rowNode;
                return adjacency[rowNode];
            });


            // Define X and Y scales
            const x = d3.scaleBand()
                .domain(nodes)
                .range([0, width])
                .padding(0.1);

            const y = d3.scaleBand()
                .domain(nodes)
                .range([0, height])
                .padding(0.1);

            var color = d3.scaleSequential(d3.interpolateBlues)
                .domain([0,1]);

            const make_class = (item) => item.toLowerCase().split(' ').join('_').split('-').join('') // source: https://observablehq.com/@fabiodesousa/adjacency-matrix
            const make_id = d => `coords_${Math.floor(x(d.xval))}_${Math.floor(y(d.yval))}` // source: https://observablehq.com/@fabiodesousa/adjacency-matrix

            const tooltip = d3.select("#tooltip");

            // Add X and Y axes
            chart.append("g")
                .attr("class", "axis axis-x")
                .call(d3.axisTop(x))              
                .selectAll("text") 
                .attr("transform", "rotate(-45)")
                .attr("dx", "10px")
                .attr("dy", "0px");

            chart.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(y));

            // Add cells, source: https://observablehq.com/@fabiodesousa/adjacency-matrix
            const rects = chart.append("g")
                .selectAll("g")
                .data(matrix)
                .enter().append("g")
                .attr("class", (d, i) => `${i} bar`)
                .selectAll("g")
                .data(d => categories.map(e => {return {'xval' : d.index, 'yval' : e, 'count': d[e]}}))
                .enter().append("g")
                .attr("class", (d, i) => `${i} tile`)

                .on("mouseover", (event, d) => {
                    rects.selectAll("rect")
                        .style("opacity", r => r.xval == d.xval || r.yval == d.yval ? 1 : 0.1);
                    tooltip
                        .html(`<strong>${d.xval}</strong> — <strong>${d.yval}</strong>: ${d.count ? "connected" : "not connected"}`)
                        .style("opacity", 1);
                })

                .on("mousemove", (event) => {
                tooltip
                    .style("left", (event.pageX + 12) + "px")
                    .style("top",  (event.pageY - 28) + "px");
                })

                .on("mouseout", () => {
                    rects.selectAll("rect")
                    .style("opacity", 1);
                })  
              
            rects.append("rect")
                  .attr("x", d => x(d.xval))
                  .attr("y", d => y(d.yval))
                  .attr("width", x.bandwidth())
                  .attr("height", y.bandwidth())
                  .style("fill", d => color(d.count))
                  .append("title")
                  .text(d => d.count)
              
            rects.append("text")
                  .attr("id", d => make_id(d))
                  .attr("dy", ".35em")
                  .attr("x", d => x(d.xval) + x.bandwidth() / 2)
                  .attr("y", d => y(d.yval) + y.bandwidth() / 2)
                  .text(d => d.count)
                  .style("font-size", "1rem")
                  .style("opacity", "0")
                  .style("text-anchor", "middle")

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", svgWidth / 2)
                .attr("y", 30) 
                .attr("text-anchor", "middle") 
                .text("Dolphins Social Network – Adjacency Matrix");

        });
    </script>
</body>
</html>
