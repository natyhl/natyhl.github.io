<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart in D3</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* CSS styles for the chart */
        .dot {
            fill: #64c8c8;
        }
        .dot:hover {
            fill: orange;
        }
        .axis-x path,
        .axis-y path {
            fill: none;
            stroke: black;
            shape-rendering: crispEdges;
        }

        .axis-x .tick line,
        .axis-y .tick line {
            stroke: #ccc;
        }

        .axis text {
            font-size: 12px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>

        // Set up the SVG container
        const svgWidth = 1200;
        const svgHeight = 600;
        const margin = { top: 60, right: 20, bottom: 80, left: 100 };
        
        const width = svgWidth - margin.left - margin.right;
        const height = svgHeight - margin.top - margin.bottom;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight);


        const chart = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.csv("us-parks.csv").then(function(data) {

            // Convert string values to numbers
            data.forEach(function(d) {
                d.RecreationVisits = +d.RecreationVisits;
            });

            // Define X and Y scales
            const scaleX = d3.scaleLinear()
                .domain([d3.min(data, d => d.Year), d3.max(data, d => d.Year)])
                .range([0, width])

            const scaleY = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.RecreationVisits)])
                .nice()
                .range([height, 0]);

            // Add X and Y axes
            chart.append("g")
                .attr("class", "axis axis-x")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(scaleX))
                .selectAll("text") 

            chart.append("g")
                .attr("class", "axis axis-y")
                .call(d3.axisLeft(scaleY).ticks(5));

            // Add dots
            chart.selectAll(".dot")
                .data(data)
                .enter()
                .append("circle")
                .attr("class", "dot")
                .attr("cx", d => scaleX(d.Year))
                .attr("cy", d => scaleY(d.RecreationVisits))
                .attr("r", 5);

            // Add title, http://www.d3noob.org/2013/01/adding-title-to-your-d3js-graph.html
            svg.append("text")
                .attr("x", svgWidth / 2)
                .attr("y", 30) 
                .attr("text-anchor", "middle") 
                .text("Yosemite National Park Recreation Visits - Scatter Plot");

            // X-axis label
            //Source: https://stackoverflow.com/questions/11189284/d3-axis-labeling
            svg.append("text")
                .attr("class", "x label")
                .attr("text-anchor", "middle")
                .attr("x", svgWidth / 2)
                .attr("y", svgHeight - 20)
                .text("Year");

            // Y-axis label
            svg.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "middle")
                .attr("x", -svgHeight / 2)
                .attr("y", 15)
                .attr("dy", ".75em")
                .attr("transform", "rotate(-90)")
                .text("Recreation Visits");

        });
    </script>
</body>
</html>
